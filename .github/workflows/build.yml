name: Build Modern APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6.0
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-9.6.0/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacebookManager-modern-debug
          path: app/build/outputs/apk/debug/*.apk
